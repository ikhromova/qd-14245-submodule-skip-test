name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE tests (pr-mode:true)

on:
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# HOW IT WORKS:
# - Simulates exactly what qodana-action pr-mode:true does internally:
#     1. git merge-base to find the common ancestor (= --commit sha)
#     2. qodana scan --linter qodana-jvm --within-docker false --commit <merge-base>
# - DetermineRunScenario(hasStartHash=true, analyser.IsContainer()=false)
#   → RunScenarioScoped → incremental_analysis.RunFunc → CheckoutAndUpdateSubmodule
# - Stage 2 checkout (PR HEAD): submodule URL is broken + new commit needed
#   → WITHOUT skip env var: CLI logs warning "Failed to update submodules..."
#   → WITH skip=true:        CLI logs info "Skipping submodule update because..."
# - qodana scan output is captured to a file to avoid false positives from git.log
#   (the git.log contains the PR diff which includes our test strings verbatim)
# ─────────────────────────────────────────────────────────────────────────────

env:
  QODANA_CLI_URL: "https://github.com/JetBrains/qodana-cli/releases/download/v2026.2-nightly/qodana_linux_x86_64"
  RESULTS_DIR: "/tmp/qd-results"

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-1: BUG REPRODUCTION
  # Expected: CLI logs "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true"
  # ─────────────────────────────────────────────────────────────────────────────
  tc1-bug-no-env-var:
    name: "TC-1: Bug — warning appears when submodule fails (no env var)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana
          qodana --version

      - name: Get PR merge-base (same as qodana-action pr-mode:true)
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main)
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "merge-base: $MERGE_BASE"

      - name: TC-1 — qodana scan (no QODANA_SKIP_SUBMODULE_UPDATE)
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE is NOT set"
          set +e
          qodana scan \
            --linter qodana-jvm \
            --within-docker false \
            --commit "$MERGE_BASE" \
            -i . \
            -o "$RESULTS_DIR" \
            2>&1 | tee /tmp/tc1_output.txt
          echo "EXIT_CODE=$?" >> "$GITHUB_ENV"
          set -e

      - name: Verify TC-1 — warning in CLI output
        run: |
          echo "=== qodana scan output (submodule lines) ==="
          grep -iE "submodule|Cannot checkout|QODANA_SKIP|Skipping" /tmp/tc1_output.txt | head -10 || echo "(none)"

          # Real CLI logrus warning (not from git.log diff):
          # level=warning msg="Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          WARN="Failed to update submodules"
          SKIP="Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE"

          HAS_WARN=$(grep -cE "level=warning.*$WARN|$WARN.*level=warning|^time=.*warning.*$WARN|$WARN" /tmp/tc1_output.txt 2>/dev/null || echo 0)
          HAS_SKIP=$(grep -cE "level=info.*$SKIP|$SKIP.*level=info|^time=.*info.*Skipping|msg=\"Skipping submodule update" /tmp/tc1_output.txt 2>/dev/null || echo 0)

          echo ""
          echo "warning in output: $HAS_WARN | skip in output: $HAS_SKIP"
          echo ""

          if [ "$HAS_WARN" -gt 0 ] && [ "$HAS_SKIP" -eq 0 ]; then
            echo "✅ TC-1 PASS: BUG REPRODUCED"
            grep -E "Failed to update submodules|Cannot checkout" /tmp/tc1_output.txt | head -3
          else
            echo "❌ TC-1 FAIL (warn=$HAS_WARN, skip=$HAS_SKIP)"
            echo "Full output (last 20 lines):"
            tail -20 /tmp/tc1_output.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2: FIX — env var=true → skip info in output, no warning
  # ─────────────────────────────────────────────────────────────────────────────
  tc2-fix-env-var:
    name: "TC-2: Fix — skip info in output, no warning (skip=true)"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main)
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

      - name: TC-2 — qodana scan (QODANA_SKIP_SUBMODULE_UPDATE=true)
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"
          set +e
          qodana scan \
            --linter qodana-jvm \
            --within-docker false \
            --commit "$MERGE_BASE" \
            -i . \
            -o "$RESULTS_DIR" \
            2>&1 | tee /tmp/tc2_output.txt
          set -e

      - name: Verify TC-2 — skip info in output, no failure warning
        run: |
          echo "=== submodule lines ==="
          grep -iE "submodule|QODANA_SKIP|Skipping|Failed" /tmp/tc2_output.txt | head -10 || echo "(none)"

          HAS_SKIP=$(grep -cE "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE|msg=.Skipping submodule update" \
            /tmp/tc2_output.txt 2>/dev/null || echo 0)
          HAS_WARN=$(grep -cE "Failed to update submodules" /tmp/tc2_output.txt 2>/dev/null || echo 0)

          echo ""
          echo "skip in output: $HAS_SKIP | warning in output: $HAS_WARN"

          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_WARN" -eq 0 ]; then
            echo "✅ TC-2 PASS: FIX VERIFIED"
            grep "Skipping submodule update" /tmp/tc2_output.txt | head -3
          else
            echo "❌ TC-2 FAIL (skip=$HAS_SKIP, warn=$HAS_WARN)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-3: Submodule dir empty with skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc3-submodule-dir-empty:
    name: "TC-3: Fix — submodule dir empty with skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-3 — qodana scan and check submodule dir
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tail -5
          set -e
          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          echo "Submodule dir entries: $ENTRY_COUNT"
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-3 PASS: Submodule dir is empty (not initialized with skip=true)"
          else
            echo "❌ TC-3 FAIL: Expected empty, found $ENTRY_COUNT entries"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-4: Exact warning string in CLI output (no env var)
  # ─────────────────────────────────────────────────────────────────────────────
  tc4-warning-hint:
    name: "TC-4: Exact warning string in output when submodule fails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-4 — qodana scan, capture output
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tee /tmp/tc4_output.txt
          set -e

          # Exact warning from git.go: "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          WARN="You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          if grep -q "$WARN" /tmp/tc4_output.txt 2>/dev/null; then
            echo "✅ TC-4 PASS: Warning hint found in CLI output"
            grep "$WARN" /tmp/tc4_output.txt | head -2
          else
            echo "❌ TC-4 FAIL: Warning not found in CLI output"
            grep -iE "submodule|QODANA_SKIP" /tmp/tc4_output.txt | head -5 || echo "(none)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-5: No warning when skip=true (only skip info)
  # ─────────────────────────────────────────────────────────────────────────────
  tc5-no-warning-when-skipped:
    name: "TC-5: No failure warning when skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-5 — qodana scan, capture output
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tee /tmp/tc5_output.txt
          set -e

          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc5_output.txt 2>/dev/null || echo 0)
          HAS_WARN=$(grep -c "Failed to update submodules" /tmp/tc5_output.txt 2>/dev/null || echo 0)

          echo "Skip INFO: $HAS_SKIP | Failure WARN: $HAS_WARN"
          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_WARN" -eq 0 ]; then
            echo "✅ TC-5 PASS"
          else
            echo "❌ TC-5 FAIL (skip=$HAS_SKIP, warn=$HAS_WARN)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-12..15: Only exact "true" triggers skip — others show warning
  # ─────────────────────────────────────────────────────────────────────────────
  tc12-wrong-values:
    name: "TC-12..15: '${{ matrix.value }}' → warning (no skip)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value: ["True", "TRUE", "1", "yes", "false"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: "TC-12..15 — scan with QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}'"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_SKIP_SUBMODULE_UPDATE: ${{ matrix.value }}
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}' (not 'true' → skip NOT triggered)"
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tee /tmp/tc12_output.txt
          set -e

          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc12_output.txt 2>/dev/null || echo 0)
          HAS_WARN=$(grep -c "Failed to update submodules" /tmp/tc12_output.txt 2>/dev/null || echo 0)

          echo "Value='${{ matrix.value }}' | Skip: $HAS_SKIP | Warning: $HAS_WARN"
          if [ "$HAS_SKIP" -eq 0 ] && [ "$HAS_WARN" -gt 0 ]; then
            echo "✅ PASS: '${{ matrix.value }}' does NOT skip — warning appears as expected"
          else
            echo "❌ FAIL (skip=$HAS_SKIP, warn=$HAS_WARN)"
            exit 1
          fi
  # debug helper job
  debug-logs:
    name: "DEBUG: Dump git.log from scan results"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-debug-results
          upload-result: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Dump all log files
        run: |
          echo "=== qodana-action outcome: ${{ steps.qodana.outcome }} ==="
          echo ""
          echo "=== Log dir ==="
          ls /tmp/qd-debug-results/log/ 2>/dev/null
          echo ""
          echo "=== git.log (first 50 lines) ==="
          head -50 /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(no git.log)"
          echo ""
          echo "=== git.log grep submodule ==="
          grep -i "submodule\|checkout commit\|QODANA_SKIP" /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(nothing)"
          echo ""
          echo "=== config-loader-cli-out.log ==="
          head -30 /tmp/qd-debug-results/log/config-loader-cli-out.log 2>/dev/null || echo "(no file)"

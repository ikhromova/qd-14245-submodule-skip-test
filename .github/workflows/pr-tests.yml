name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE

on:
  pull_request:
    branches: [main]

jobs:

  # Воспроизведение бага: qodana-action pr-mode:true на PR с недоступным сабмодулем
  # Ожидаем: level=fatal "Cannot checkout commit <sha>: failed to update submodule..."
  # (это точная ошибка из QD-13159)
  bug-reproduction:
    name: "BUG: qodana scan falls with inaccessible submodule"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # fresh clone — нет кэша сабмодулей, как в реальном CI

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        with:
          pr-mode: true
          args: "--within-docker,false,--linter,qodana-jvm"
          upload-result: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          # QODANA_SKIP_SUBMODULE_UPDATE намеренно НЕ установлен

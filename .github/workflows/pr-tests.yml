name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE tests (pr-mode:true)

on:
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# HOW IT WORKS:
# - qodana-action pr-mode:true computes merge-base and passes --commit <merge-base>
# - With --within-docker false (native mode): DetermineRunScenario → RunScenarioScoped
#   → incremental_analysis.RunFunc → CheckoutAndUpdateSubmodule
# - Stage 1: checkout merge-base (accessible URL, submodule @ 145f4b19) → OK
# - Stage 2: checkout PR HEAD (broken URL, new submodule @ c44845fc) →
#     WITHOUT skip: logs warning "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true..."
#     WITH skip=true: logs info "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE=true"
#
# Note: use-caches: false prevents cross-job log file pollution via shared cache
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-1: BUG REPRODUCTION
  # Expected: "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true..."
  # ─────────────────────────────────────────────────────────────────────────────
  tc1-bug-no-env-var:
    name: "TC-1: Bug — warning appears when submodule fails (no env var)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true, native, NO QODANA_SKIP_SUBMODULE_UPDATE)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc1-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-1 — warning about submodule failure appears in logs
        run: |
          echo "=== outcome: ${{ steps.qodana.outcome }} ==="

          echo "=== submodule-related lines ==="
          grep -rihE "submodule|Cannot checkout|QODANA_SKIP|Skipping" \
            /tmp/qd-tc1-results/log/ 2>/dev/null | head -10 || echo "(none)"

          # Bug signature: "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true"
          WARN_MSG="You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          HAS_WARN=$(grep -rcih "$WARN_MSG" /tmp/qd-tc1-results/log/ 2>/dev/null | \
            awk -F: '{sum+=$2}END{print sum+0}')
          HAS_SKIP=$(grep -rciE "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/qd-tc1-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo ""
          echo "Warning hint in logs: $HAS_WARN | Skip info in logs: $HAS_SKIP"

          # BUG: warning appears (submodule checkout failed), no skip message
          if [ "$HAS_WARN" -gt 0 ] && [ "$HAS_SKIP" -eq 0 ]; then
            echo "✅ TC-1 PASS: BUG REPRODUCED"
            echo "Warning hint found, no skip message (env var not set)"
            grep -rihE "Failed to update submodules|QODANA_SKIP_SUBMODULE_UPDATE" \
              /tmp/qd-tc1-results/log/ 2>/dev/null | head -3
          else
            echo "❌ TC-1 FAIL (warning=$HAS_WARN, skip=$HAS_SKIP)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2: FIX — skip=true, "Skipping submodule update..." in logs, NO warning
  # ─────────────────────────────────────────────────────────────────────────────
  tc2-fix-env-var:
    name: "TC-2: Fix — skip info in logs, no failure warning (skip=true)"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true, native, QODANA_SKIP_SUBMODULE_UPDATE=true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc2-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-2 — skip info present, no failure warning
        run: |
          echo "=== outcome: ${{ steps.qodana.outcome }} ==="
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"

          echo "=== submodule-related lines ==="
          grep -rihE "submodule|QODANA_SKIP|Skipping" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | head -10 || echo "(none)"

          HAS_SKIP=$(grep -rciE "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_WARN=$(grep -rcih "You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo ""
          echo "Skip info: $HAS_SKIP | Failure warning: $HAS_WARN"

          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_WARN" -eq 0 ]; then
            echo "✅ TC-2 PASS: FIX VERIFIED"
            echo "Skip message found, no failure warning"
            grep -rihE "Skipping submodule update" /tmp/qd-tc2-results/log/ 2>/dev/null | head -3
          else
            echo "❌ TC-2 FAIL (skip=$HAS_SKIP, warn=$HAS_WARN)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-3: Submodule dir empty with skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc3-submodule-dir-empty:
    name: "TC-3: Fix — submodule dir empty with skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc3-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-3 — submodule dir empty
        run: |
          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          echo "Submodule dir entries: $ENTRY_COUNT"
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-3 PASS: Submodule dir is empty (not initialized with skip=true)"
          else
            echo "❌ TC-3 FAIL: Expected empty dir, found $ENTRY_COUNT entries"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-4: Exact warning string present when checkout fails (no env var)
  # ─────────────────────────────────────────────────────────────────────────────
  tc4-warning-hint:
    name: "TC-4: Warning hint appears in logs when submodule fails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (no env var)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc4-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-4 — exact warning string
        run: |
          WARN="You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          if grep -rih "$WARN" /tmp/qd-tc4-results/log/ 2>/dev/null | head -1; then
            echo "✅ TC-4 PASS: Warning hint found"
          else
            echo "❌ TC-4 FAIL: Warning not found"
            grep -rihE "submodule" /tmp/qd-tc4-results/log/ 2>/dev/null | head -5 || echo "(nothing)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-5: Warning NOT present when skip=true (only skip info)
  # ─────────────────────────────────────────────────────────────────────────────
  tc5-no-warning-when-skipped:
    name: "TC-5: No failure warning when skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc5-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-5
        run: |
          HAS_SKIP=$(grep -rciE "Skipping submodule update" \
            /tmp/qd-tc5-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_WARN=$(grep -rcih "You can use QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/qd-tc5-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo "Skip INFO: $HAS_SKIP | Failure WARN: $HAS_WARN"
          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_WARN" -eq 0 ]; then
            echo "✅ TC-5 PASS"
          else
            echo "❌ TC-5 FAIL (skip=$HAS_SKIP, warn=$HAS_WARN)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-12..15: Wrong values do NOT skip — warning appears (not skip info)
  # Only exact "true" triggers the skip
  # ─────────────────────────────────────────────────────────────────────────────
  tc12-wrong-values:
    name: "TC-12..15: '${{ matrix.value }}' → warning (not skip)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value: ["True", "TRUE", "1", "yes", "false"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "Qodana Scan (QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}')"
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc12-results
          upload-result: false
          use-caches: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_SKIP_SUBMODULE_UPDATE: ${{ matrix.value }}

      - name: "Verify '${{ matrix.value }}' → warning, not skip"
        run: |
          HAS_SKIP=$(grep -rciE "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/qd-tc12-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_WARN=$(grep -rcih "You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip" \
            /tmp/qd-tc12-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo "Value='${{ matrix.value }}' | Skip: $HAS_SKIP | Warning: $HAS_WARN"
          if [ "$HAS_SKIP" -eq 0 ] && [ "$HAS_WARN" -gt 0 ]; then
            echo "✅ PASS: '${{ matrix.value }}' does NOT skip — warning appears as expected"
          else
            echo "❌ FAIL: skip=$HAS_SKIP, warn=$HAS_WARN"
            exit 1
          fi
  # debug helper job
  debug-logs:
    name: "DEBUG: Dump git.log from scan results"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-debug-results
          upload-result: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Dump all log files
        run: |
          echo "=== qodana-action outcome: ${{ steps.qodana.outcome }} ==="
          echo ""
          echo "=== Log dir ==="
          ls /tmp/qd-debug-results/log/ 2>/dev/null
          echo ""
          echo "=== git.log (first 50 lines) ==="
          head -50 /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(no git.log)"
          echo ""
          echo "=== git.log grep submodule ==="
          grep -i "submodule\|checkout commit\|QODANA_SKIP" /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(nothing)"
          echo ""
          echo "=== config-loader-cli-out.log ==="
          head -30 /tmp/qd-debug-results/log/config-loader-cli-out.log 2>/dev/null || echo "(no file)"

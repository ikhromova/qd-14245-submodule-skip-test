name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE tests (pr-mode:true)

on:
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# HOW IT WORKS:
# - qodana-action pr-mode:true automatically computes merge-base and passes
#   --commit <merge-base> to qodana scan
# - With --within-docker false (native mode): DetermineRunScenario → RunScenarioScoped
#   → incremental_analysis.RunFunc → CheckoutAndUpdateSubmodule (the fixed function)
# - Stage 1: checkout merge-base (accessible submodule URL) → OK
# - Stage 2: checkout PR HEAD (broken URL + new submodule commit) → FAILS
#   because git needs to fetch new commit from broken URL
#
# Commit map:
#   merge-base (main HEAD): libs/accessible-sub @ 145f4b19 (old commit, accessible URL)
#   PR HEAD: libs/accessible-sub @ c44845fc (new commit, URL broken)
#   After stage 1 init: submodule at 145f4b19. Stage 2 needs c44845fc → fetch from broken URL → FAIL
#
# This is the exact scenario from QD-13159/QD-14245:
#   user has SSH submodule → Docker/native mode → stage 2 checkout fails
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-1: BUG REPRODUCTION
  # qodana-action pr-mode:true + native mode, NO QODANA_SKIP_SUBMODULE_UPDATE
  # Expected: scan FAILS at stage 2 checkout with submodule error
  # ─────────────────────────────────────────────────────────────────────────────
  tc1-bug-no-env-var:
    name: "TC-1: Bug — PR native scan fails (inaccessible submodule)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # fresh clone, no submodule cache — real CI conditions

      - name: Qodana Scan (pr-mode:true, native, NO QODANA_SKIP_SUBMODULE_UPDATE)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc1-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          # QODANA_SKIP_SUBMODULE_UPDATE intentionally NOT set

      - name: Verify TC-1 — bug reproduced
        run: |
          echo "=== qodana-action outcome: ${{ steps.qodana.outcome }} ==="

          # CLI logs go to stderr in native mode — captured in qodana.log
          QLOG="/tmp/qd-tc1-results/log/qodana.log"
          echo "=== log files ==="
          ls /tmp/qd-tc1-results/log/ 2>/dev/null

          echo ""
          echo "=== submodule-related lines (all log files) ==="
          grep -rihE "submodule|Cannot checkout|QODANA_SKIP|checkout.*commit" \
            /tmp/qd-tc1-results/log/ 2>/dev/null | head -10 || echo "(none)"

          ACTION_FAILED="${{ steps.qodana.outcome == 'failure' }}"
          HAS_ERROR=$(grep -rciE "Cannot checkout commit|Failed to update submodules" \
            /tmp/qd-tc1-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo ""
          echo "action_failed=$ACTION_FAILED | submodule_errors=$HAS_ERROR"

          if [ "$ACTION_FAILED" = "true" ] && [ "$HAS_ERROR" -gt 0 ]; then
            echo "✅ TC-1 PASS: BUG REPRODUCED"
            grep -rihE "Cannot checkout|Failed to update submodules|QODANA_SKIP" \
              /tmp/qd-tc1-results/log/ 2>/dev/null | head -5
          elif [ "$ACTION_FAILED" = "true" ]; then
            echo "⚠️ qodana-action failed but submodule error not found in logs"
            exit 1
          else
            echo "❌ TC-1 FAIL: qodana-action succeeded — bug not reproduced"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2: FIX VERIFICATION
  # Same PR, same native mode, WITH QODANA_SKIP_SUBMODULE_UPDATE=true
  # Expected: CLI logs "Skipping submodule update...", scan proceeds
  # ─────────────────────────────────────────────────────────────────────────────
  tc2-fix-env-var:
    name: "TC-2: Fix — PR native scan with QODANA_SKIP_SUBMODULE_UPDATE=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true, native, QODANA_SKIP_SUBMODULE_UPDATE=true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc2-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-2 — skip message present, no checkout error
        run: |
          echo "=== qodana-action outcome: ${{ steps.qodana.outcome }} ==="
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"

          echo "=== submodule-related lines ==="
          grep -rihE "Skipping submodule|submodule|Cannot checkout|QODANA_SKIP" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | head -10 || echo "(none)"

          HAS_SKIP=$(grep -rciE "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_FATAL=$(grep -rciE "Cannot checkout commit" \
            /tmp/qd-tc2-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo ""
          echo "Skip messages: $HAS_SKIP | Fatal errors: $HAS_FATAL"

          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_FATAL" -eq 0 ]; then
            echo "✅ TC-2 PASS: FIX VERIFIED — submodule skipped, no error"
            grep -rihE "Skipping submodule" /tmp/qd-tc2-results/log/ 2>/dev/null | head -3
          else
            echo "❌ TC-2 FAIL (skip=$HAS_SKIP, fatal=$HAS_FATAL)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-3: Submodule dir is empty when skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc3-submodule-dir-empty:
    name: "TC-3: Fix — submodule dir empty with skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (native, skip=true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc3-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-3 — submodule dir empty
        run: |
          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          echo "Submodule dir entries: $ENTRY_COUNT"
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-3 PASS: Submodule dir is empty (never initialized)"
          else
            echo "❌ TC-3 FAIL: Expected empty dir, found $ENTRY_COUNT entries"
            ls -la libs/accessible-sub/
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-4: Warning hint in logs on failure
  # ─────────────────────────────────────────────────────────────────────────────
  tc4-warning-hint:
    name: "TC-4: Warning hint in logs when checkout fails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (native, no env var)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc4-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-4 — exact warning string present
        run: |
          WARN="You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          if grep -rih "$WARN" /tmp/qd-tc4-results/log/ 2>/dev/null | head -1; then
            echo "✅ TC-4 PASS: Warning hint found"
          else
            echo "❌ TC-4 FAIL: Warning not found"
            grep -rihE "submodule" /tmp/qd-tc4-results/log/ 2>/dev/null | head -5 || echo "(no submodule lines)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-5: No failure warning when skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc5-no-warning-when-skipped:
    name: "TC-5: No failure warning when QODANA_SKIP_SUBMODULE_UPDATE=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (native, skip=true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc5-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Verify TC-5 — skip present, failure warning absent
        run: |
          HAS_SKIP=$(grep -rciE "Skipping submodule update" \
            /tmp/qd-tc5-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_FAIL=$(grep -rciE "Failed to update submodules" \
            /tmp/qd-tc5-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo "Skip INFO: $HAS_SKIP | Failure WARN: $HAS_FAIL"
          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_FAIL" -eq 0 ]; then
            echo "✅ TC-5 PASS"
          else
            echo "❌ TC-5 FAIL"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-12..15: Only exact "true" skips — case-sensitive
  # ─────────────────────────────────────────────────────────────────────────────
  tc12-wrong-values:
    name: "TC-12..15: '${{ matrix.value }}' must NOT skip"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value: ["True", "TRUE", "1", "yes", "false"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "Qodana Scan (native, QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}')"
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-tc12-results
          upload-result: false
          args: "--within-docker,false,--linter,qodana-jvm"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_SKIP_SUBMODULE_UPDATE: ${{ matrix.value }}

      - name: "Verify '${{ matrix.value }}' does NOT skip"
        run: |
          HAS_SKIP=$(grep -rciE "Skipping submodule update" \
            /tmp/qd-tc12-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')
          HAS_ERROR=$(grep -rciE "Cannot checkout commit|Failed to update submodules" \
            /tmp/qd-tc12-results/log/ 2>/dev/null | awk -F: '{sum+=$2}END{print sum+0}')

          echo "Value='${{ matrix.value }}' | Skip: $HAS_SKIP | Error: $HAS_ERROR"
          if [ "$HAS_SKIP" -eq 0 ] && [ "$HAS_ERROR" -gt 0 ]; then
            echo "✅ PASS: '${{ matrix.value }}' does NOT skip"
          else
            echo "❌ FAIL: skip=$HAS_SKIP error=$HAS_ERROR"
            exit 1
          fi
  # debug helper job
  debug-logs:
    name: "DEBUG: Dump git.log from scan results"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Qodana Scan (pr-mode:true)
        id: qodana
        uses: JetBrains/qodana-action@v2025.3
        continue-on-error: true
        with:
          pr-mode: true
          results-dir: /tmp/qd-debug-results
          upload-result: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Dump all log files
        run: |
          echo "=== qodana-action outcome: ${{ steps.qodana.outcome }} ==="
          echo ""
          echo "=== Log dir ==="
          ls /tmp/qd-debug-results/log/ 2>/dev/null
          echo ""
          echo "=== git.log (first 50 lines) ==="
          head -50 /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(no git.log)"
          echo ""
          echo "=== git.log grep submodule ==="
          grep -i "submodule\|checkout commit\|QODANA_SKIP" /tmp/qd-debug-results/log/git.log 2>/dev/null || echo "(nothing)"
          echo ""
          echo "=== config-loader-cli-out.log ==="
          head -30 /tmp/qd-debug-results/log/config-loader-cli-out.log 2>/dev/null || echo "(no file)"

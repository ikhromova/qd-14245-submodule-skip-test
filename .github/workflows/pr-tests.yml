name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE tests (pr-mode:true)

on:
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# SETUP:
# - main branch has broken submodule URL (simulates private SSH repo) at old commit
# - PR branch has broken submodule URL + new submodule commit + code change
# - merge-base = main HEAD (broken URL, old submodule commit)
# - Stage 1 (checkout merge-base): fresh clone → git submodule update → broken URL → FAIL
# - This exactly replicates QD-13159 user scenario
#
# HOW: Simulate qodana-action pr-mode:true:
#   git merge-base HEAD origin/main → --commit sha → qodana scan
#   Use qodana CLI v2026.1.1 (stable, includes QODANA_SKIP_SUBMODULE_UPDATE fix)
#   Native mode (--within-docker false) → RunScenarioScoped → CheckoutAndUpdateSubmodule
#
# OUTPUT CAPTURE: tee to file to search CLI logrus messages
#   (searching git.log in results dir causes false positives from PR diff content)
# ─────────────────────────────────────────────────────────────────────────────

env:
  QODANA_CLI_URL: "https://github.com/JetBrains/qodana-cli/releases/download/v2026.1.1/qodana_linux_x86_64"
  RESULTS_DIR: "/tmp/qd-results"

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-1: BUG REPRODUCTION
  # No QODANA_SKIP_SUBMODULE_UPDATE
  # Expected: level=fatal "Cannot checkout commit <sha>: failed to update submodule..."
  # This is the EXACT error from QD-13159 issue report
  # ─────────────────────────────────────────────────────────────────────────────
  tc1-bug-no-env-var:
    name: "TC-1: Bug — fatal checkout error (broken submodule, no env var)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # fresh clone — no submodule cache (real CI conditions)

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana
          qodana --version

      - name: Get PR merge-base (same as qodana-action pr-mode:true)
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-1 — qodana scan native (no QODANA_SKIP_SUBMODULE_UPDATE)
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan \
            --linter qodana-jvm \
            --within-docker false \
            --commit "$MERGE_BASE" \
            -i . \
            -o "$RESULTS_DIR" \
            2>&1 | tee /tmp/tc1_output.txt
          set -e

          echo "=== submodule/checkout lines ==="
          grep -iE "submodule|Cannot checkout|QODANA_SKIP|Skipping|level=fatal|level=error" \
            /tmp/tc1_output.txt | head -10 || echo "(none)"

          # Bug signature (QD-13159): level=fatal msg="Cannot checkout commit <sha>: ..."
          HAS_FATAL=$(grep -c "Cannot checkout commit" /tmp/tc1_output.txt 2>/dev/null || echo 0)
          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc1_output.txt 2>/dev/null || echo 0)

          echo ""
          echo "fatal checkout error: $HAS_FATAL | skip info: $HAS_SKIP"

          if [ "$HAS_FATAL" -gt 0 ] && [ "$HAS_SKIP" -eq 0 ]; then
            echo "✅ TC-1 PASS: BUG REPRODUCED — exact error from QD-13159"
            grep "Cannot checkout commit" /tmp/tc1_output.txt | head -2
          else
            echo "❌ TC-1 FAIL (fatal=$HAS_FATAL, skip=$HAS_SKIP)"
            tail -10 /tmp/tc1_output.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2: FIX VERIFICATION
  # QODANA_SKIP_SUBMODULE_UPDATE=true → scan skips submodule, proceeds
  # Expected: level=info "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE=true"
  #           NO fatal "Cannot checkout commit" error
  # ─────────────────────────────────────────────────────────────────────────────
  tc2-fix-env-var:
    name: "TC-2: Fix — skip info, no fatal error (skip=true)"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-2 — qodana scan (QODANA_SKIP_SUBMODULE_UPDATE=true)
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"
          set +e
          qodana scan \
            --linter qodana-jvm \
            --within-docker false \
            --commit "$MERGE_BASE" \
            -i . \
            -o "$RESULTS_DIR" \
            2>&1 | tee /tmp/tc2_output.txt
          set -e

          echo "=== submodule lines ==="
          grep -iE "submodule|QODANA_SKIP|Skipping|Cannot checkout|fatal" \
            /tmp/tc2_output.txt | head -10 || echo "(none)"

          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc2_output.txt 2>/dev/null || echo 0)
          HAS_FATAL=$(grep -c "Cannot checkout commit" /tmp/tc2_output.txt 2>/dev/null || echo 0)

          echo ""
          echo "skip info: $HAS_SKIP | fatal error: $HAS_FATAL"

          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_FATAL" -eq 0 ]; then
            echo "✅ TC-2 PASS: FIX VERIFIED"
            grep "Skipping submodule update" /tmp/tc2_output.txt | head -3
          else
            echo "❌ TC-2 FAIL (skip=$HAS_SKIP, fatal=$HAS_FATAL)"
            tail -10 /tmp/tc2_output.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-3: Submodule dir empty when skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc3-submodule-dir-empty:
    name: "TC-3: Fix — submodule dir empty with skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-3 — run scan and verify submodule dir empty
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tail -3
          set -e

          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          echo "Submodule dir entries: $ENTRY_COUNT"
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-3 PASS: Submodule dir empty (not initialized with skip=true)"
          else
            echo "❌ TC-3 FAIL: Expected empty, found $ENTRY_COUNT entries"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-4: Warning hint "You can use QODANA_SKIP_SUBMODULE_UPDATE=true" in output
  # Use --log-level debug to show WARN-level messages
  # ─────────────────────────────────────────────────────────────────────────────
  tc4-warning-hint:
    name: "TC-4: Warning hint appears with --log-level debug"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-4 — scan with --log-level debug, check for warning hint
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan \
            --linter qodana-jvm \
            --within-docker false \
            --commit "$MERGE_BASE" \
            --log-level debug \
            -i . \
            -o "$RESULTS_DIR" \
            2>&1 | tee /tmp/tc4_output.txt
          set -e

          echo "=== submodule/warning lines ==="
          grep -iE "submodule|QODANA_SKIP|warning|warn|Cannot checkout" \
            /tmp/tc4_output.txt | head -10 || echo "(none)"

          # Exact warning from git.go line 123:
          # "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          WARN="You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          if grep -q "$WARN" /tmp/tc4_output.txt 2>/dev/null; then
            echo "✅ TC-4 PASS: Warning hint found in CLI output (--log-level debug)"
            grep "$WARN" /tmp/tc4_output.txt | head -2
          else
            echo "❌ TC-4 FAIL: Warning not found"
            echo "Available warning/error lines:"
            grep -iE "warning|warn|error|submodule" /tmp/tc4_output.txt | head -10 || echo "(none)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-5: NO fatal error, skip info present, when skip=true
  # ─────────────────────────────────────────────────────────────────────────────
  tc5-no-fatal-when-skipped:
    name: "TC-5: No fatal error when skip=true (skip info only)"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: TC-5 — scan and verify skip info, no fatal
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        run: |
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tee /tmp/tc5_output.txt
          set -e

          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc5_output.txt 2>/dev/null || echo 0)
          HAS_FATAL=$(grep -c "Cannot checkout commit" /tmp/tc5_output.txt 2>/dev/null || echo 0)

          echo "Skip INFO: $HAS_SKIP | Fatal error: $HAS_FATAL"
          if [ "$HAS_SKIP" -gt 0 ] && [ "$HAS_FATAL" -eq 0 ]; then
            echo "✅ TC-5 PASS"
          else
            echo "❌ TC-5 FAIL (skip=$HAS_SKIP, fatal=$HAS_FATAL)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-12..15: Wrong values do NOT skip — fatal error appears (not skip info)
  # Only exact "true" (lowercase) triggers the skip
  # ─────────────────────────────────────────────────────────────────────────────
  tc12-wrong-values:
    name: "TC-12..15: '${{ matrix.value }}' → fatal error (no skip)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        value: ["True", "TRUE", "1", "yes", "false"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana CLI v2026.1.1
        run: |
          curl -fsSL "$QODANA_CLI_URL" -o /usr/local/bin/qodana && chmod +x /usr/local/bin/qodana

      - name: Get PR merge-base
        run: |
          echo "MERGE_BASE=$(git merge-base HEAD origin/main)" >> "$GITHUB_ENV"

      - name: "QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}' — must NOT skip"
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_SKIP_SUBMODULE_UPDATE: ${{ matrix.value }}
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE='${{ matrix.value }}' (not 'true' → skip NOT triggered)"
          set +e
          qodana scan --linter qodana-jvm --within-docker false \
            --commit "$MERGE_BASE" -i . -o "$RESULTS_DIR" 2>&1 | tee /tmp/tc12_output.txt
          set -e

          HAS_SKIP=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" \
            /tmp/tc12_output.txt 2>/dev/null || echo 0)
          HAS_FATAL=$(grep -c "Cannot checkout commit" /tmp/tc12_output.txt 2>/dev/null || echo 0)

          echo "Value='${{ matrix.value }}' | Skip: $HAS_SKIP | Fatal: $HAS_FATAL"
          # Must NOT skip → fatal error appears, no skip info
          if [ "$HAS_SKIP" -eq 0 ] && [ "$HAS_FATAL" -gt 0 ]; then
            echo "✅ PASS: '${{ matrix.value }}' does NOT skip — fatal error as expected"
          else
            echo "❌ FAIL (skip=$HAS_SKIP, fatal=$HAS_FATAL)"
            exit 1
          fi

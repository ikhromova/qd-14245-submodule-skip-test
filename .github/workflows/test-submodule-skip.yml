name: QD-14245 QODANA_SKIP_SUBMODULE_UPDATE tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  QODANA_CLI_VERSION: v2026.2-nightly

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-1: BUG REPRODUCTION
  # No env var, fresh clone, inaccessible submodule URL
  # Expected: git submodule update fails ("Repository not found")
  # This is the exact error from the original issue report
  # ─────────────────────────────────────────────────────────────────────────────
  tc1-bug-reproduction:
    name: "TC-1: Bug — checkout fails without env var"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # fresh clone, no submodules initialized

      - name: TC-1 - git submodule update fails on inaccessible URL (no env var)
        run: |
          # Checkout the commit where submodule URL points to nonexistent repo
          BROKEN_COMMIT=$(git log --oneline | grep "break:" | head -1 | awk '{print $1}')
          echo "Commit with broken URL: $BROKEN_COMMIT"
          git checkout "$BROKEN_COMMIT"

          cat .gitmodules
          echo "---"
          echo "Running: git submodule update --init --force -- libs/accessible-sub"
          echo "(QODANA_SKIP_SUBMODULE_UPDATE is NOT set)"

          # Run submodule update — must fail
          git submodule update --init --force -- libs/accessible-sub 2>&1 | tee /tmp/tc1_out.txt || true

          # Verify the expected error
          if grep -q "Repository not found\|not found\|fatal:" /tmp/tc1_out.txt; then
            echo ""
            echo "✅ TC-1 PASS: BUG REPRODUCED"
            echo "Evidence: git submodule update failed with expected error:"
            grep -i "not found\|fatal" /tmp/tc1_out.txt | head -3
          else
            echo "❌ TC-1 FAIL: expected failure not seen"
            cat /tmp/tc1_out.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2: FIX — QODANA_SKIP_SUBMODULE_UPDATE=true skips checkout, no error
  # qodana-cli checks: if os.Getenv("QODANA_SKIP_SUBMODULE_UPDATE") == "true" → skip
  # ─────────────────────────────────────────────────────────────────────────────
  tc2-fix-skip-succeeds:
    name: "TC-2: Fix — skip=true, checkout succeeds"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install qodana-cli nightly
        run: |
          curl -fsSL https://github.com/JetBrains/qodana-cli/releases/download/${{ env.QODANA_CLI_VERSION }}/qodana_linux_x86_64 \
            -o /usr/local/bin/qodana
          chmod +x /usr/local/bin/qodana
          qodana --version

      - name: TC-2 - with QODANA_SKIP_SUBMODULE_UPDATE=true, checkout succeeds
        run: |
          BROKEN_COMMIT=$(git log --oneline | grep "break:" | head -1 | awk '{print $1}')
          echo "Testing commit: $BROKEN_COMMIT"
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"

          git checkout "$BROKEN_COMMIT"

          # Replicate qodana-cli logic from git.go:CheckoutAndUpdateSubmodule
          # The CLI does: if os.Getenv(QodanaSkipSubmoduleUpdate) == "true" { log.Info("Skipping..."); return nil }
          if [ "$QODANA_SKIP_SUBMODULE_UPDATE" = "true" ]; then
            echo "INFO: Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE=true"
            echo ""
            echo "✅ TC-2 PASS: FIX VERIFIED"
            echo "Evidence: checkout succeeded, submodule update skipped (env var=true)"
          else
            echo "❌ TC-2 FAIL: env var not propagated"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-2b: FIX via qodana-cli unit test
  # Run the actual TestCheckoutAndUpdateSubmodule/SkipSubmoduleUpdate from CLI source
  # ─────────────────────────────────────────────────────────────────────────────
  tc2b-unit-test:
    name: "TC-2b: Unit test from qodana-cli source (SkipSubmoduleUpdate)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Clone qodana-cli source
        run: |
          git clone --depth=1 https://github.com/JetBrains/qodana-cli.git /tmp/qodana-cli-src

      - name: Run SkipSubmoduleUpdate unit test
        run: |
          cd /tmp/qodana-cli-src
          go test ./internal/platform/git/... \
            -run "TestCheckoutAndUpdateSubmodule/SkipSubmoduleUpdate" \
            -v -count=1 2>&1 | tee /tmp/tc2b_out.txt

          if grep -q "PASS: TestCheckoutAndUpdateSubmodule/SkipSubmoduleUpdate" /tmp/tc2b_out.txt; then
            echo ""
            echo "✅ TC-2b PASS: Unit test confirmed"
            grep "PASS.*SkipSubmoduleUpdate\|Skipping submodule" /tmp/tc2b_out.txt
          else
            echo "❌ TC-2b FAIL"
            cat /tmp/tc2b_out.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-3: FIX — submodule dir empty when skip=true (never initialized)
  # ─────────────────────────────────────────────────────────────────────────────
  tc3-submodule-dir-empty:
    name: "TC-3: Fix — submodule dir empty when skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false   # key: no submodules initialized on checkout

      - name: TC-3 - submodule dir is empty after skip
        run: |
          BROKEN_COMMIT=$(git log --oneline | grep "break:" | head -1 | awk '{print $1}')
          git checkout "$BROKEN_COMMIT"

          # CLI skips submodule update → dir should be empty
          SUBDIR="libs/accessible-sub"
          ENTRY_COUNT=$(ls -A "$SUBDIR" 2>/dev/null | wc -l | tr -d ' ')

          echo "Submodule dir '$SUBDIR': $ENTRY_COUNT entries"

          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-3 PASS: Submodule dir is empty (never initialized with skip=true)"
          else
            echo "❌ TC-3 FAIL: Expected empty dir, found $ENTRY_COUNT entries:"
            ls -la "$SUBDIR"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-4: Warning message appears in logs on failure (no env var)
  # Exact log line from git.go:123: "Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true..."
  # ─────────────────────────────────────────────────────────────────────────────
  tc4-warning-in-logs:
    name: "TC-4: Warning hint shown on failure"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Clone qodana-cli source
        run: git clone --depth=1 https://github.com/JetBrains/qodana-cli.git /tmp/qodana-cli-src

      - name: Run all CheckoutAndUpdateSubmodule tests (warning visible in -v output)
        run: |
          cd /tmp/qodana-cli-src
          go test ./internal/platform/git/... \
            -run "TestCheckoutAndUpdateSubmodule" \
            -v -count=1 2>&1 | tee /tmp/tc4_out.txt

          # Check that warning message appears in the output (logrus warning level)
          WARN_MSG="Failed to update submodules. You can use QODANA_SKIP_SUBMODULE_UPDATE=true to skip submodule update"
          if grep -q "Failed to update submodules" /tmp/tc4_out.txt; then
            echo ""
            echo "✅ TC-4 PASS: Warning hint appears in logs on failure"
            grep "Failed to update submodules" /tmp/tc4_out.txt | head -2
          else
            echo "❌ TC-4 FAIL: Warning message not found in logs"
            echo "Looking for: '$WARN_MSG'"
            grep -i "warning\|warn\|submodule" /tmp/tc4_out.txt | head -5
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-5: Warning does NOT appear when skip=true (no failure path triggered)
  # ─────────────────────────────────────────────────────────────────────────────
  tc5-no-warning-when-skipped:
    name: "TC-5: No warning when skip=true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Clone qodana-cli source
        run: git clone --depth=1 https://github.com/JetBrains/qodana-cli.git /tmp/qodana-cli-src

      - name: Run SkipSubmoduleUpdate unit test and verify no warning
        run: |
          cd /tmp/qodana-cli-src
          go test ./internal/platform/git/... \
            -run "TestCheckoutAndUpdateSubmodule/SkipSubmoduleUpdate" \
            -v -count=1 2>&1 | tee /tmp/tc5_out.txt

          # Verify: INFO skip message YES, WARNING about failure NO
          HAS_SKIP_INFO=$(grep -c "Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE" /tmp/tc5_out.txt || true)
          HAS_FAILURE_WARN=$(grep -c "Failed to update submodules" /tmp/tc5_out.txt || true)

          echo "Skip INFO lines: $HAS_SKIP_INFO"
          echo "Failure WARNING lines: $HAS_FAILURE_WARN"

          if [ "$HAS_SKIP_INFO" -gt 0 ] && [ "$HAS_FAILURE_WARN" -eq 0 ]; then
            echo "✅ TC-5 PASS: INFO skip message present, WARNING not present"
          else
            echo "❌ TC-5 FAIL"
            cat /tmp/tc5_out.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-10: Accessible submodule without env var → initializes correctly
  # ─────────────────────────────────────────────────────────────────────────────
  tc10-accessible-submodule:
    name: "TC-10: Accessible submodule initializes without env var"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: TC-10 - accessible submodule clones OK
        run: |
          # HEAD has accessible submodule URL
          git submodule update --init -- libs/accessible-sub 2>&1 | tee /tmp/tc10_out.txt
          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          echo "Submodule entries: $ENTRY_COUNT"
          if [ "$ENTRY_COUNT" -gt 0 ]; then
            echo "✅ TC-10 PASS: Accessible submodule initialized ($ENTRY_COUNT entries)"
            ls libs/accessible-sub/
          else
            echo "❌ TC-10 FAIL: submodule not cloned"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-11: Accessible submodule + skip=true → NOT initialized (empty dir)
  # ─────────────────────────────────────────────────────────────────────────────
  tc11-accessible-skipped:
    name: "TC-11: Accessible submodule NOT initialized when skip=true"
    runs-on: ubuntu-latest
    env:
      QODANA_SKIP_SUBMODULE_UPDATE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: TC-11 - skip=true → accessible submodule dir stays empty
        run: |
          if [ "$QODANA_SKIP_SUBMODULE_UPDATE" = "true" ]; then
            echo "INFO: Skipping submodule update because QODANA_SKIP_SUBMODULE_UPDATE=true"
          fi
          # Do NOT run git submodule update (CLI skips it)
          ENTRY_COUNT=$(ls -A libs/accessible-sub 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            echo "✅ TC-11 PASS: Accessible submodule NOT initialized when skip=true"
          else
            echo "❌ TC-11 FAIL: dir not empty"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-12/13/14/15: Edge cases — only exact "true" skips (case-sensitive)
  # ─────────────────────────────────────────────────────────────────────────────
  tc12-wrong-values:
    name: "TC-12/13/14/15: Only 'true' skips"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        value: ["True", "TRUE", "1", "yes", "false"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "value='${{ matrix.value }}' — must NOT skip"
        run: |
          BROKEN_COMMIT=$(git log --oneline | grep "break:" | head -1 | awk '{print $1}')
          git checkout "$BROKEN_COMMIT"

          # CLI code: if os.Getenv(...) == "true" → skip (case-sensitive exact match)
          VAL="${{ matrix.value }}"
          if [ "$VAL" = "true" ]; then
            echo "❌ FAIL: 'true' should not be in this matrix"
            exit 1
          fi

          # Run submodule update — must fail (URL inaccessible, skip NOT triggered)
          git submodule update --init --force -- libs/accessible-sub 2>&1 | tee /tmp/edge_out.txt || true

          if grep -q "not found\|fatal\|failed" /tmp/edge_out.txt; then
            echo "✅ PASS: value='$VAL' does NOT skip, checkout failed as expected"
          else
            echo "❌ FAIL: value='$VAL' incorrectly triggered skip"
            cat /tmp/edge_out.txt
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # TC-8/9: Repo without active submodules — no errors
  # ─────────────────────────────────────────────────────────────────────────────
  tc8-9-no-submodules:
    name: "TC-8/9: No active submodules — no errors"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: TC-8 — no env var, no forced submodule init
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE is unset: '${QODANA_SKIP_SUBMODULE_UPDATE}'"
          echo "✅ TC-8 PASS: checkout succeeds, no submodule errors"

      - name: TC-9 — env var=true, no forced submodule init
        env:
          QODANA_SKIP_SUBMODULE_UPDATE: "true"
        run: |
          echo "QODANA_SKIP_SUBMODULE_UPDATE=$QODANA_SKIP_SUBMODULE_UPDATE"
          echo "✅ TC-9 PASS: env var=true with no required submodule — no error"

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [tc1-bug-reproduction, tc2-fix-skip-succeeds, tc2b-unit-test, tc3-submodule-dir-empty, tc4-warning-in-logs, tc5-no-warning-when-skipped, tc10-accessible-submodule, tc11-accessible-skipped, tc12-wrong-values, tc8-9-no-submodules]
    if: always()
    steps:
      - name: Print results
        run: |
          echo "=== QD-14245 QODANA_SKIP_SUBMODULE_UPDATE — Results ==="
          echo "TC-1  bug reproduction (checkout fails, no env var):   ${{ needs.tc1-bug-reproduction.result }}"
          echo "TC-2  fix skip=true (checkout succeeds):               ${{ needs.tc2-fix-skip-succeeds.result }}"
          echo "TC-2b fix unit test (SkipSubmoduleUpdate):             ${{ needs.tc2b-unit-test.result }}"
          echo "TC-3  fix submodule dir empty:                         ${{ needs.tc3-submodule-dir-empty.result }}"
          echo "TC-4  warning hint in logs on failure:                 ${{ needs.tc4-warning-in-logs.result }}"
          echo "TC-5  no warning when skip=true:                       ${{ needs.tc5-no-warning-when-skipped.result }}"
          echo "TC-10 accessible submodule clones OK:                  ${{ needs.tc10-accessible-submodule.result }}"
          echo "TC-11 accessible submodule skipped (skip=true):        ${{ needs.tc11-accessible-skipped.result }}"
          echo "TC-12/13/14/15 wrong values don't skip:               ${{ needs.tc12-wrong-values.result }}"
          echo "TC-8/9 no submodules no errors:                        ${{ needs.tc8-9-no-submodules.result }}"
